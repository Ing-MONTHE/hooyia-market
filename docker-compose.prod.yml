# ==============================================================
# HOOYIA MARKET — Docker Compose Production
# ==============================================================
# Commandes utiles :
#   Démarrer    : docker-compose -f docker-compose.prod.yml up -d
#   Arrêter     : docker-compose -f docker-compose.prod.yml down
#   Logs        : docker-compose -f docker-compose.prod.yml logs -f
#   Rebuild     : docker-compose -f docker-compose.prod.yml up -d --build
# ==============================================================

services:

  # ════════════════════════════════════════════════════════════
  # BASE DE DONNÉES — PostgreSQL
  # ════════════════════════════════════════════════════════════
  db:
    image: postgres:16-alpine
    restart: always                         # Toujours redémarrer en prod (pas "unless-stopped")
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Pas de "ports" en prod — PostgreSQL n'est pas exposé à l'extérieur
    # Seul le réseau Docker interne peut y accéder
    networks:
      - hooyia_network

  # ════════════════════════════════════════════════════════════
  # REDIS — Broker Celery + Django Channels
  # ════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    restart: always
    # Pas de "ports" en prod — Redis n'est pas exposé à l'extérieur
    volumes:
      - redis_data:/data
    # Mot de passe Redis en production pour sécuriser l'accès
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    networks:
      - hooyia_network

  # ════════════════════════════════════════════════════════════
  # APPLICATION — Django via Daphne (HTTP + WebSocket)
  # ════════════════════════════════════════════════════════════
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env.prod
    volumes:
      # Pas de bind mount en prod — on utilise le code copié dans l'image
      - staticfiles:/app/staticfiles
      - mediafiles:/app/mediafiles
    # Pas de "ports" exposés directement — Nginx fait le pont
    expose:
      - "8000"
    depends_on:
      - db
      - redis
    # Utilise entrypoint.sh pour les migrations + démarrage (étape 6)
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    networks:
      - hooyia_network

  # ════════════════════════════════════════════════════════════
  # CELERY — Worker pour les tâches asynchrones
  # ════════════════════════════════════════════════════════════
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env.prod
    volumes:
      # Pas de bind mount en prod
      - mediafiles:/app/mediafiles
    depends_on:
      - db
      - redis
    # Moins de logs en prod (warning au lieu de info)
    command: celery -A config worker --loglevel=warning --concurrency=2
    networks:
      - hooyia_network

  # ════════════════════════════════════════════════════════════
  # NGINX — Reverse proxy + SSL
  # Seul service exposé à l'extérieur (ports 80 et 443)
  # ════════════════════════════════════════════════════════════
  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"       # HTTP  — redirige vers HTTPS
      - "443:443"     # HTTPS — trafic chiffré
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf
      - staticfiles:/app/staticfiles
      - mediafiles:/app/mediafiles
      # Certificats SSL générés par Certbot (Let's Encrypt)
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    depends_on:
      - web
    networks:
      - hooyia_network

  # ════════════════════════════════════════════════════════════
  # CERTBOT — Certificats SSL gratuits (Let's Encrypt)
  # Renouvelle automatiquement les certificats HTTPS
  # ════════════════════════════════════════════════════════════
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    # Renouvelle le certificat si nécessaire (expire tous les 90 jours)
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

# ── Réseau interne isolé ──────────────────────────────────────
# Tous les services communiquent entre eux via ce réseau privé
# Seul Nginx est accessible depuis l'extérieur
networks:
  hooyia_network:
    driver: bridge

# ── Volumes persistants ───────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  staticfiles:
  mediafiles:
  certbot_www:      # Fichiers de validation Let's Encrypt
  certbot_conf:     # Certificats SSL stockés ici
