name: CI/CD — Hooyia Market

# Declancheur
on:
  push:
    branches: [main]


env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Nom de l'image sur GitHub Container Registry (ghcr.io)
  # On utilise github.repository (format owner/repo) qui est toujours en minuscules
  # contrairement à github.repository_owner qui peut contenir des majuscules
  IMAGE_NAME: ghcr.io/${{ github.repository }}

  # Arrete le job en cour et relance le nouveau job a chaque nouveau push sur la branche main.
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ════════════════════════════════════════════════════════════
  # JOB 1 — TESTS (CI)
  # Lance les tests Django dans un environnement propre
  # ════════════════════════════════════════════════════════════
  tests:
    name: Tests Django
    runs-on: ubuntu-latest

    # Services pour les tests (PostgreSQL + Redis)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hooyia_test
          POSTGRES_USER: hooyia
          POSTGRES_PASSWORD: hooyia_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      # redis:
      #   image: redis:7-alpine
      #   ports:
      #     - 6379:6379
      #   options: >-
      #     --health-cmd "redis-cli ping"
      #     --health-interval 5s
      #     --health-timeout 5s
      #     --health-retries 5

    # Variables d'environnement pour les tests
    env:
      SECRET_KEY: "test-secret-key-not-used-in-production"
      DEBUG: "True"
      DB_NAME: hooyia_test
      DB_USER: hooyia
      DB_PASSWORD: hooyia_test_password
      DB_HOST: localhost
      DB_PORT: 5432
      # REDIS_URL: redis://localhost:6379/0
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend

    steps:
      # 1. Récupère le code source
      - name: Checkout du code
        uses: actions/checkout@v4.2.2

      # 2. Installe Python
      - name: Installation de Python 3.12
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      # 3. Installe les dépendances
      - name: Installation des dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install virtualenv
          virtualenv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Attendre que postgres soit pret
        run: |
          until pg_isready -h localhost -p 5432; do
            echo "Attente de PostgreSQL..."
            sleep 5
          done

      # - name: attendre que redis soit pret
      #   run: |
      #     until redis-cli -h localhost -p 6379 ping | grep PONG; do
      #       echo "Attente de Redis..."
      #       sleep 5
      #     done

      - name: 🛠️ Preparation de la base de données
        run: |
          source venv/bin/activate
          python manage.py migrate --noinput # Applique les migrations sans interaction
          python manage.py collectstatic --noinput -v 0  # Collecte les fichiers statiques sans interaction et sans verbosité

      # 5. Lance les tests Django
      - name: 🧪 Lancement des tests
        run: |
          source venv/bin/activate
          python manage.py test --verbosity=2 | tee test_output.log # Affiche les résultats des tests et les enregistre dans un fichier

      # 6. Affiche les resultats des tests en cas d'echecs
      - name: Affichage des resultats en cas d'echec
        if: failure()
        run: |
          echo "❌ Certains tests ont échoué. Voici les détails :"
          cat test_output.log
          exit 1

      - name: Notification succes des tests
        if: success()
        run: echo "✅ Tous les tests ont réussi ! Prêt pour le build."

      - name: Email en cas d'echec des tests
        if: failure()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ Échec des tests sur Hooyia Market"
          to: "monthejunior45@gmail.com"
          from: "CI/CD Hooyia Market"
          body: |
            Bonjour,

            Les tests automatisés pour le projet Hooyia Market ont échoué. Veuillez consulter les logs pour plus de détails.

            Cordialement,
            Votre equipe Hooyia Market
          attachments: test_output.log

  # ════════════════════════════════════════════════════════════
  # JOB 2 — BUILD & PUSH (nouvelle étape)
  # Construit l'image Docker et la pousse sur GitHub Container
  # Registry (ghcr.io). Si le build échoue, on n'arrive jamais
  # en prod — la prod ne tombe plus à cause d'un Dockerfile cassé.
  # ════════════════════════════════════════════════════════════
  build:
    needs: tests  # Lance uniquement si les tests passent
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    # Permission d'écriture sur ghcr.io via le token GitHub automatique
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4.2.2

      # Active BuildKit (builder avancé : cache, multi-stage plus rapide)
      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Connexion à GitHub Container Registry avec le token automatique
      # Pas besoin de secret supplémentaire — GITHUB_TOKEN suffit
      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build l'image et la pousse sur ghcr.io
      # On tague avec le SHA du commit pour tracer exactement quelle version est déployée
      # + le tag "latest" pour que le VPS puisse toujours tirer la dernière version
      - name: Build et Push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Cache BuildKit sur ghcr.io pour accélérer les builds suivants
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Email en cas d'echec du build
        if: failure()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ Échec du build Docker sur Hooyia Market"
          to: "monthejunior45@gmail.com"
          from: "CI/CD Hooyia Market"
          body: |
            Bonjour,

            Le build de l'image Docker a échoué. La production n'a pas été affectée.
            Veuillez consulter les logs du pipeline pour plus de détails.

            Cordialement,
            Votre Equipe Hooyia Market

  # ════════════════════════════════════════════════════════════
  # JOB 3 — DÉPLOIEMENT (CD)
  # Se connecte au VPS et tire l'image déjà buildée depuis ghcr.io
  # Plus de build sur le VPS — juste un docker pull + restart
  # ════════════════════════════════════════════════════════════
  deploy:
    needs: build  # Lance uniquement si le build a réussi
    name: Déploiement sur Linode
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4.2.2

      - name: Configuration SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts # Ajoute le VPS à la liste des hôtes connus pour éviter les prompts de confirmation

      - name: Deploiement sur le VPS
        run: |
          echo "🚀 Déploiement en cours sur le VPS..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << EOF
            set -e

            echo "📁 Accès au dossier du projet..."
            cd ${{ secrets.VPS_PROJECT_PATH }}

            echo "⬇️  Récupération du dernier code..."
            git pull origin main

            # Connexion à ghcr.io pour pouvoir tirer l'image privée
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # On injecte le SHA du commit pour que le VPS tire exactement
            # la même image que celle buildée par le job précédent
            export IMAGE_TAG=${{ github.sha }}
            export IMAGE_NAME=${{ env.IMAGE_NAME }}

            echo "⬇️  Téléchargement de la nouvelle image depuis ghcr.io..."
            docker pull \${IMAGE_NAME}:\${IMAGE_TAG}

            echo "🔄 Redémarrage des conteneurs avec la nouvelle image..."
            # IMAGE_TAG est lue par docker-compose.prod.yml (voir note ci-dessous)
            IMAGE_TAG=\${IMAGE_TAG} docker compose -f docker-compose.prod.yml up -d

            echo "🧹 Nettoyage des images Docker inutilisées..."
            docker image prune -f

            echo "✅ Déploiement terminé !"
          EOF

      - name: Email en cas d'echec du deploiement
        if: failure()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ Échec du déploiement sur Hooyia Market"
          to: "monthejunior45@gmail.com"
          from: "CI/CD Hooyia Market"
          body: |
            Bonjour,

            Le déploiement de la dernière version de Hooyia Market sur le VPS a échoué.
            Veuillez vérifier les logs du pipeline pour plus de détails.

            Cordialement,
            Votre Equipe Hooyia Market

      - name: Email en cas de succes du deploiement
        if: success()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ Déploiement réussi sur Hooyia Market"
          to: "monthejunior45@gmail.com"
          from: "CI/CD Hooyia Market"
          body: |
            Bonjour,

            Le déploiement de la dernière version de Hooyia Market sur le VPS a été effectué avec succès.
            La nouvelle version est maintenant en ligne !

            Cordialement,
            Votre Equipe Hooyia Market
