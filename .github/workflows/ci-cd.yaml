name: CI/CD — Hooyia Market

on:
  push:
    branches: [feature/docker-configuration]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Annule le run précédent sur la même branche dès qu'un nouveau push arrive
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ════════════════════════════════════════════════════════════
  # JOB 1 — BUILD, TESTS & PUSH (CI)
  # ════════════════════════════════════════════════════════════
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4.2.2

      # ── Tailwind CSS ──────────────────────────────────────────
      # Cache npm pour éviter de retélécharger node_modules à chaque run
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Compilation Tailwind CSS (production)
        run: |
          npm ci
          npm run tw:build

      # ── Docker ───────────────────────────────────────────────
      - name: Définition de IMAGE_NAME en minuscules
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et Push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # Push uniquement sur push main, pas sur les PR
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Tests Django dans l'image buildée
        run: |
          set -o pipefail
          IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.test.yml run --rm web | tee test_output.log
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Logs des tests en cas d'échec
        if: failure()
        run: |
          echo "❌ Les tests ont échoué. Détails :"
          cat test_output.log
          docker compose -f docker-compose.test.yml logs
          exit 1

      - name: Email — Échec du build
        if: failure()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ Échec du build Docker — Hooyia Market"
          to: "monthejunior45@gmail.com"
          from: "CI/CD Hooyia Market"
          body: |
            Le build de l'image Docker a échoué. La production n'a pas été affectée.
            Consultez les logs du pipeline pour plus de détails.

  # ════════════════════════════════════════════════════════════
  # JOB 2 — DÉPLOIEMENT (CD)
  # Uniquement sur push main (jamais sur PR)
  # ════════════════════════════════════════════════════════════
  deploy:
    needs: build
    name: Déploiement sur Linode
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4.2.2

      - name: Définition de IMAGE_NAME en minuscules
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Configuration SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # Copie uniquement le fichier compose — plus de git pull sur le VPS
      - name: Envoi du docker-compose.prod.yml sur le VPS
        run: |
          scp -o StrictHostKeyChecking=no docker-compose.prod.yml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PROJECT_PATH }}/

      - name: Déploiement sur le VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << EOF
            set -e
            cd ${{ secrets.VPS_PROJECT_PATH }}

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export IMAGE_TAG=${{ github.sha }}
            export IMAGE_NAME=${{ env.IMAGE_NAME }}

            echo "⬇️  Pull de la nouvelle image..."
            docker pull \${IMAGE_NAME}:\${IMAGE_TAG}

            echo "🔄 Redémarrage des conteneurs..."
            IMAGE_TAG=\${IMAGE_TAG} docker compose -f docker-compose.prod.yml up -d --force-recreate --pull always

            echo "🧹 Nettoyage des images obsolètes..."
            docker image prune -f

            echo "✅ Déploiement terminé !"
          EOF

      - name: Email — Échec du déploiement
        if: failure()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ Échec du déploiement — Hooyia Market"
          to: "monthejunior45@gmail.com"
          from: "CI/CD Hooyia Market"
          body: |
            Le déploiement a échoué. Vérifiez les logs du pipeline.

      - name: Email — Déploiement réussi
        if: success()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ Déploiement réussi — Hooyia Market"
          to: "monthejunior45@gmail.com"
          from: "CI/CD Hooyia Market"
          body: |
            La nouvelle version de Hooyia Market est en ligne !
