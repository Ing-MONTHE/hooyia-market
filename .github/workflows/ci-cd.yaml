name: CI/CD — Hooyia Market

# ══════════════════════════════════════════════════════════════
# DÉCLENCHEUR
# Ce pipeline se lance automatiquement à chaque push sur "main"
# ══════════════════════════════════════════════════════════════
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ════════════════════════════════════════════════════════════
  # JOB 1 — TESTS (CI)
  # Lance les tests Django dans un environnement propre
  # ════════════════════════════════════════════════════════════
  tests:
    name: Tests Django
    runs-on: ubuntu-latest

    # Services nécessaires pour les tests (PostgreSQL + Redis)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hooyia_test
          POSTGRES_USER: hooyia
          POSTGRES_PASSWORD: hooyia_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    # Variables d'environnement pour les tests
    env:
      SECRET_KEY: "test-secret-key-not-used-in-production"
      DEBUG: "True"
      DB_NAME: hooyia_test
      DB_USER: hooyia
      DB_PASSWORD: hooyia_test_password
      DB_HOST: localhost
      DB_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend

    steps:
      # 1. Récupère le code source
      - name: Checkout du code
        uses: actions/checkout@v4

      # 2. Installe Python
      - name: Installation de Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # 3. Installe les dépendances système (comme dans le Dockerfile)
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libmagic-dev

      # 4. Installe les dépendances Python
      - name: Dépendances Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Lance les tests Django
      - name: 🧪 Lancement des tests
        run: python manage.py test --verbosity=2

  # ════════════════════════════════════════════════════════════
  # JOB 2 — DÉPLOIEMENT (CD)
  # Se connecte au VPS Linode et met à jour l'application
  # Ne se lance QUE si les tests passent ET sur la branche main
  # ════════════════════════════════════════════════════════════
  deploy:
    name: 🚀 Déploiement sur Linode
    runs-on: ubuntu-latest
    needs: tests  # Attend que les tests réussissent
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # 1. Se connecte au VPS via SSH et déploie
      - name: 🔐 Connexion SSH + Déploiement
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo "📁 Accès au dossier du projet..."
            cd ${{ secrets.VPS_PROJECT_PATH }}

            echo "⬇️  Récupération du dernier code..."
            git pull origin main

            echo "🐳 Rebuild et redémarrage des conteneurs..."
            docker compose -f docker-compose.prod.yml up -d --build

            echo "🧹 Nettoyage des images Docker inutilisées..."
            docker image prune -f

            echo "✅ Déploiement terminé !"
