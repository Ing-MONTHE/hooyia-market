# ==============================================================
# HOOYIA MARKET — Docker Compose Tests
# Utilisé uniquement par le pipeline CI/CD (Job 2 — build)
# Lance les tests Django dans l'image déjà buildée sur ghcr.io
# pour s'assurer que l'image qui part en prod est fonctionnelle

services:

  # ════════════════════════════════════════════════════════════
  # BASE DE DONNÉES — PostgreSQL de test
  # Identique au dev mais avec des credentials de test
  # ════════════════════════════════════════════════════════════
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hooyia_test
      POSTGRES_USER: hooyia
      POSTGRES_PASSWORD: hooyia_test_password
    # Pas de volume — la base est détruite après les tests
    # Pas de ports exposés — seul le réseau interne est utilisé

  # ════════════════════════════════════════════════════════════
  # REDIS — Nécessaire pour les tests WebSocket (channels_redis)
  # Les tests chat/notifications utilisent Redis comme channel layer
  # ════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    # Pas de volume ni de mot de passe — contexte de test uniquement

  # ════════════════════════════════════════════════════════════
  # APPLICATION — Utilise l'image déjà buildée sur ghcr.io
  # Pas de build: ici — on tire l'image du registry
  # ════════════════════════════════════════════════════════════
  web:
    # L'image est injectée par le pipeline via la variable IMAGE_NAME et github.sha
    # ex: ghcr.io/ing-monthe/hooyia-market:5cafc3e
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    # On bypasse entrypoint.sh qui démarre Daphne — sinon le conteneur
    # reste en "listening" indéfiniment et bloque le pipeline
    entrypoint: [""]
    command: sh -c "python manage.py migrate --noinput && python manage.py test --verbosity=2"
    environment:
      SECRET_KEY: "test-secret-key-not-used-in-production"
      DEBUG: "True"
      DB_NAME: hooyia_test
      DB_USER: hooyia
      DB_PASSWORD: hooyia_test_password
      DB_HOST: db        # Nom du service PostgreSQL défini ci-dessus
      DB_PORT: 5432
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      REDIS_URL: redis://redis:6379/0  # Redis de test pour les WebSockets
    depends_on: # Assure que la base de données et Redis sont prêts avant de lancer les tests
      - db
      - redis
