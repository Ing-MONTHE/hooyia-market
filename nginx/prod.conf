# ==============================================================
# HOOYIA MARKET — Configuration Nginx Production
# ==============================================================
# HTTP  (port 80)  → redirige vers HTTPS
# HTTPS (port 443) → sert l'application avec SSL
# Remplace "tondomaine.com" par ton vrai domaine partout
# ==============================================================

# Groupe de serveurs vers lesquels Nginx redirige les requêtes
# "web" = nom du service Django dans docker-compose.prod.yml
upstream django {
    server web:8000;
}

# ══════════════════════════════════════════════════════════════
# SERVEUR HTTP — Redirige tout le trafic vers HTTPS
# ══════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name tondomaine.com www.tondomaine.com;

    # Route spéciale pour Let's Encrypt (validation du domaine)
    # Certbot dépose un fichier ici pour prouver que tu possèdes le domaine
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirige tout le reste vers HTTPS (301 = redirection permanente)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ══════════════════════════════════════════════════════════════
# SERVEUR HTTPS — Sert l'application avec SSL
# ══════════════════════════════════════════════════════════════
server {
    listen 443 ssl;
    server_name tondomaine.com www.tondomaine.com;

    # Taille maximale des fichiers uploadés (photos produits...)
    client_max_body_size 20M;

    # ──────────────────────────────────────────────────────────
    # CERTIFICATS SSL — générés par Certbot (Let's Encrypt)
    # Ces fichiers sont créés automatiquement à l'étape 7
    # ──────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/tondomaine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tondomaine.com/privkey.pem;

    # Paramètres SSL recommandés (sécurité moderne)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Cache les sessions SSL pour éviter de renégocier à chaque requête
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ──────────────────────────────────────────────────────────
    # HEADERS DE SÉCURITÉ — protection contre les attaques courantes
    # ──────────────────────────────────────────────────────────

    # Force le navigateur à utiliser HTTPS pendant 1 an
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Empêche le chargement de ton site dans une iframe (clickjacking)
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Empêche le navigateur de deviner le type MIME (sniffing)
    add_header X-Content-Type-Options "nosniff" always;

    # Active la protection XSS du navigateur
    add_header X-XSS-Protection "1; mode=block" always;

    # ──────────────────────────────────────────────────────────
    # FICHIERS STATIQUES — servis directement par Nginx
    # ──────────────────────────────────────────────────────────
    location /static/ {
        alias /app/staticfiles/;
        # Cache navigateur 1 an en prod (les fichiers ne changent pas souvent)
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ──────────────────────────────────────────────────────────
    # FICHIERS MÉDIAS — images uploadées par les utilisateurs
    # ──────────────────────────────────────────────────────────
    location /media/ {
        alias /app/mediafiles/;
        expires 7d;
    }

    # ──────────────────────────────────────────────────────────
    # WEBSOCKETS — Chat et notifications temps réel
    # ──────────────────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://django;

        # Headers obligatoires pour les WebSockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Transmet l'IP réelle du client à Django
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout long pour les connexions WebSocket persistantes
        proxy_read_timeout 86400;
    }

    # ──────────────────────────────────────────────────────────
    # TOUTES LES AUTRES REQUÊTES — transmises à Django
    # ──────────────────────────────────────────────────────────
    location / {
        proxy_pass http://django;

        # Transmet les vrais headers du client à Django
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Indique à Django que la requête originale était en HTTPS
        # Nécessaire pour que Django génère des URLs en https:// et non http://
        proxy_set_header X-Forwarded-Proto https;

        # Timeouts standard pour les requêtes HTTP
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}