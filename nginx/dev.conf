# ==============================================================
# HOOYIA MARKET — Configuration Nginx Développement
# ==============================================================
# Pas de SSL en développement — HTTP uniquement
# Accès via : http://localhost
# ==============================================================

# Groupe de serveurs vers lesquels Nginx redirige les requêtes
# "web" = nom du service Django dans docker-compose.dev.yml
upstream django {
    server web:8000;
}

server {

    # Écoute sur le port 80 (HTTP standard)
    listen 80;
    server_name localhost 127.0.0.1;

    # Taille maximale des fichiers uploadés (photos produits...)
    client_max_body_size 20M;

    # ──────────────────────────────────────────────────────────
    # FICHIERS STATIQUES — servis directement par Nginx
    # Django n'est pas sollicité → beaucoup plus rapide
    # ──────────────────────────────────────────────────────────
    location /static/ {
        alias /app/staticfiles/;
        # Cache navigateur 1 jour en dev (1 an en prod)
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # ──────────────────────────────────────────────────────────
    # FICHIERS MÉDIAS — images uploadées par les utilisateurs
    # ──────────────────────────────────────────────────────────
    location /media/ {
        alias /app/mediafiles/;
        expires 1d;
    }

    # ──────────────────────────────────────────────────────────
    # WEBSOCKETS — Chat et notifications temps réel
    # Nécessite des headers spéciaux pour upgrader la connexion
    # de HTTP vers WebSocket
    # ──────────────────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://django;

        # Headers obligatoires pour les WebSockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Transmet l'IP réelle du client à Django
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Timeout long pour les connexions WebSocket (elles durent longtemps)
        proxy_read_timeout 86400;
    }

    # ──────────────────────────────────────────────────────────
    # TOUTES LES AUTRES REQUÊTES — transmises à Django
    # ──────────────────────────────────────────────────────────
    location / {
        proxy_pass http://django;

        # Transmet les vrais headers du client à Django
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout standard pour les requêtes HTTP
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}